<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>collab-editor</title>
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="toolbar__left">
          <label class="visually-hidden" for="doc-title">Document title</label>
          <input
            id="doc-title"
            class="title-input"
            type="text"
            placeholder="Untitled"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="toolbar__right">
          <!--
            The sync indicator reports what is actually true about replication,
            not about local persistence. Since Phase 4 the local operation log is
            written synchronously with every keystroke, so a separate "saved"
            indicator would claim something the app cannot actually promise.

            The states are deliberately distinct rather than one boolean: "offline
            but safe" and "conflict" call for completely different reactions.
          -->
          <div id="sync-status" class="sync" role="status" aria-live="polite" aria-atomic="true">
            <span class="sync__dot" aria-hidden="true"></span>
            <span id="sync-status-text" class="sync__text">Starting</span>
          </div>

          <span id="peer-count" class="peers" title="Collaborators connected"></span>

          <!--
            Encryption controls.

            Present because the feature is otherwise unreachable: a document is encrypted
            only when its URL carries `#k=`, and a user cannot hand-write that. Without
            these two buttons the cryptography exists and no one can use it.

            Deliberately two actions rather than one toggle. "Make this encrypted" is
            irreversible - a document whose log holds ciphertext cannot be read by anyone
            without the key, including us - and "make this unencrypted" is not available at
            all. A toggle would imply a round trip that does not exist.
          -->
          <div class="toolbar__crypto">
            <span
              id="crypto-badge"
              class="crypto-badge"
              hidden
              title="This document is end-to-end encrypted. The server cannot read it."
              >Encrypted</span
            >

            <button
              id="new-encrypted-doc"
              class="button button--quiet"
              type="button"
              title="Create a new document the server cannot read. The key lives in the link."
            >
              New encrypted
            </button>

            <button
              id="copy-share-link"
              class="button button--quiet"
              type="button"
              hidden
              title="Copy this link. Whoever has it can read and edit the document."
            >
              Copy link
            </button>
          </div>
        </div>
      </header>

      <!--
        Every state below is designed deliberately rather than defaulted. The
        unhappy path is where projects usually look unfinished, and it is
        exactly what an interviewer explores.
      -->
      <main class="editor-area">
        <div id="loading" class="state state--loading" role="status">
          <div class="spinner" aria-hidden="true"></div>
          <p class="state__title">Loading document…</p>
        </div>

        <div id="error" class="state state--error" role="alert" hidden>
          <p class="state__title">Something went wrong</p>
          <p id="error-message" class="state__body"></p>
          <!--
            The underlying cause, when there is one worth showing.

            Separate from the headline because the headline is written for someone who
            just wants to know what to do, and the detail is written for whoever is going
            to act on it. A crypto failure like "the link's key is 8 bytes, expected 32"
            is useless as the headline and exactly right as the detail.
          -->
          <p id="error-detail" class="state__detail"></p>
          <div class="state__actions">
            <button id="retry" class="button button--primary" type="button">Try again</button>
            <button id="new-doc" class="button" type="button">Start a new document</button>
          </div>
        </div>

        <div id="editor-host" class="editor-host"></div>
      </main>

      <footer class="statusbar">
        <span id="word-count" class="statusbar__item">0 words</span>
        <span class="statusbar__sep" aria-hidden="true">·</span>
        <span id="char-count" class="statusbar__item">0 characters</span>
        <span class="statusbar__sep" aria-hidden="true">·</span>
        <span id="log-depth" class="statusbar__item" title="Operations stored locally"></span>
        <span class="statusbar__spacer"></span>
        <span id="sync-detail" class="statusbar__item statusbar__item--muted"></span>
      </footer>
    </div>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
