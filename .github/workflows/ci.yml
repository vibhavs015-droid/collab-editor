name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — saves CI minutes and gives
# feedback faster while iterating locally.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    # Pinned, not `latest`. GitHub migrates the `ubuntu-latest` label to Ubuntu 26 on
    # 19 October 2026, and an unpinned label means a Node or filesystem change lands on this
    # project with no commit to explain it. `ubuntu-24.04` is the current LTS and is what the
    # `node:24-bookworm-slim` image approximates, so pinning also makes local and CI closer
    # rather than further apart.
    runs-on: ubuntu-24.04

    steps:
      # Pinned to v7, not v4. The v4 line targets Node 20, which GitHub has
      # deprecated for Actions runtimes; v4 still runs but emits a warning on
      # every job and will be force-upgraded to Node 24 regardless.
      - uses: actions/checkout@v7

      # Single source of truth for the Node version. Local, CI, and every
      # contributor agree because they all read .nvmrc. Nothing to drift.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Separate steps on purpose: CI output showing exactly which gate failed
      # is far more useful than one red "npm run verify".
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # A separate gate from `format:check` because they catch different problems.
      # Prettier rewrites what it can reach and ignores line endings; this reports every
      # file whose bytes disagree with .gitattributes, including ones no formatter reads.
      # Worth its own step because the failure mode it catches is invisible to review: git
      # normalises the index, so a file with mixed endings still commits cleanly and only
      # shows up later as a whole-file diff.
      - name: Line endings and encoding
        run: npm run check:line-endings

      # A wrong .gitignore rule is SILENT: git does not error on adding a file it was supposed
      # to exclude, it just adds it. This repo had `data/` where it meant `.data/`, and 997
      # files totalling 38 MB of PGlite database were committed before anyone noticed by
      # reading `git status`. Nothing else in the pipeline would ever have caught it, so this
      # asks git directly whether the rules do what they claim.
      - name: Gitignore coverage
        run: npm run check:ignore

      - name: Test
        run: npm test

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Toolchain self-check
        run: node dist/index.js

      # The gate that would have caught `ae27a82`, where the production build served
      # nothing and `/` returned 401 while every source-level test passed. It starts the
      # BUILT server as a container would and drives the page, the API, a real WebSocket
      # peer pair, cold replay from the durable log, and an encrypted document.
      #
      # A separate step rather than part of `npm test`, because it needs `dist/` and
      # folding a build into the unit suite would make the fast suite slow.
      - name: Production smoke test
        run: npm run smoke

  browser:
    name: Browser end-to-end tests
    # Separate from `verify` on purpose. These start a real server, install a browser, and
    # drive the rendered UI, so they cost minutes rather than seconds and fail for reasons
    # (a flaky network stack, a runner without the right libraries) that have nothing to do
    # with the code under test. Folding them into the fast suite would mean a runner problem
    # blocks every push, which trains people to ignore red.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Same single source of truth as every other job: .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--with-deps` installs the system libraries Chromium needs (libnss3, libatk, and the
      # rest). Without them the browser launches and then exits with a missing-shared-object
      # error that reads like a Playwright bug.
      #
      # `--no-shell` skips the ~150 MB browser download we do not use: the suite is chromium
      # only, so firefox and webkit would be dead weight on every run.
      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      # `npm run test:e2e` builds first. The build is a separate script step so a build failure
      # is reported as a build failure rather than as six failing browser tests.
      - name: Build
        run: npm run build

      # The whole point of this job. 946 source-level tests passed while the application never
      # once sent a typed character to the server, because nothing rendered the UI. Every real
      # bug this project has had lived at a seam between two well-tested layers, and a seam is
      # only observable from above one of them.
      - name: Run browser tests
        run: npx playwright test

      # Artefacts, because a failing browser test is close to useless without them: the trace
      # replays the run and the screenshot shows what the page actually looked like. Only
      # uploaded on failure, so a green run costs nothing.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  security:
    name: Dependency audit
    # Pinned, not `latest`. GitHub migrates the `ubuntu-latest` label to Ubuntu 26 on
    # 19 October 2026, and an unpinned label means a Node or filesystem change lands on this
    # project with no commit to explain it. `ubuntu-24.04` is the current LTS and is what the
    # `node:24-bookworm-slim` image approximates, so pinning also makes local and CI closer
    # rather than further apart.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Phase 0 shipped 2 critical and 1 high advisory via vitest. This gate
      # makes that class of problem impossible to reintroduce silently, and
      # dependabot.yml opens the upgrade PR automatically.
      #
      # --audit-level=high keeps the build focused on real risk rather than
      # blocking on low-severity noise that would erode the habit of reading
      # the log.
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

      # Informational. Reported, never blocking, so a newly published advisory
      # is visible in the log instead of silently ignored.
      - name: Full audit report (informational)
        run: npm audit || true
