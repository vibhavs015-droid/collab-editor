name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — saves CI minutes and gives
# feedback faster while iterating locally.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest

    steps:
      # Pinned to v7, not v4. The v4 line targets Node 20, which GitHub has
      # deprecated for Actions runtimes; v4 still runs but emits a warning on
      # every job and will be force-upgraded to Node 24 regardless.
      - uses: actions/checkout@v7

      # Single source of truth for the Node version. Local, CI, and every
      # contributor agree because they all read .nvmrc. Nothing to drift.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Separate steps on purpose: CI output showing exactly which gate failed
      # is far more useful than one red "npm run verify".
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # A separate gate from `format:check` because they catch different problems.
      # Prettier rewrites what it can reach and ignores line endings; this reports every
      # file whose bytes disagree with .gitattributes, including ones no formatter reads.
      # Worth its own step because the failure mode it catches is invisible to review: git
      # normalises the index, so a file with mixed endings still commits cleanly and only
      # shows up later as a whole-file diff.
      - name: Line endings and encoding
        run: npm run check:line-endings

      - name: Test
        run: npm test

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Toolchain self-check
        run: node dist/index.js

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Phase 0 shipped 2 critical and 1 high advisory via vitest. This gate
      # makes that class of problem impossible to reintroduce silently, and
      # dependabot.yml opens the upgrade PR automatically.
      #
      # --audit-level=high keeps the build focused on real risk rather than
      # blocking on low-severity noise that would erode the habit of reading
      # the log.
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

      # Informational. Reported, never blocking, so a newly published advisory
      # is visible in the log instead of silently ignored.
      - name: Full audit report (informational)
        run: npm audit || true
